[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nm-recipe-designer"
version = "0.1.0"
description = "Agent Skill and MCP server for designing NeMo Data Designer recipes importable into Unsloth Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "dzikiczlowiek"}]
dependencies = ["fastmcp>=3.0.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
nm-recipe-designer = "nm_recipe_designer.cli:main"
nm-recipe-mcp = "nm_recipe_designer.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nm_recipe_designer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
